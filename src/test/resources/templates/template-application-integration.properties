# HOWTO use this template?
# 1. Copy content to /src/test/resources/application-integration.properties
# 2. Adjust database name, password etc

# Integration-test properties

# Database

spring.datasource.url=jdbc:mariadb://localhost:7306/showcase_integration
spring.datasource.username=root
spring.datasource.password=<yourSuperSafePW>
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDB103Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
spring.jpa.generate-ddl=true
# Uncomment for verbose SQL statements
#spring.jpa.show-sql=true