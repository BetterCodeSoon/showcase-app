# HOWTO use this template?
# 1. Copy content to /src/main/resources/application.properties
# 2. Adjust database name, password etc

# Application properties

# Database

spring.datasource.url=jdbc:mariadb://localhost:3306/showcase_dev
spring.datasource.username=root
spring.datasource.password=<yourSuperSafePW>
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

spring.jpa.hibernate.ddl-auto=update
# Switch to none or validate in production
#spring.jpa.hibernate.ddl-auto=validate

# General

spring.application.name=showcase-backend
server.port=8080
server.servlet.context-path=/showcase-api